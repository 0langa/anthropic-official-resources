name: Update official resources
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-resource-update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache/http-v2
          key: archive-http-${{ github.run_id }}
          restore-keys: archive-http-
      - name: Test pipeline
        run: python -m unittest discover -s tests -v
      - name: Refresh English resources
        id: sync
        shell: bash
        run: |
          set +e
          python tools/pipeline.py sync --max-seconds 3600
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
      - name: Verify integrity and English-only scope
        run: python tools/pipeline.py verify
      - name: Commit retrieved content and explicit omissions
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for directory in content inventory html source-bundles assets; do
            if [ -d "$directory" ]; then git add -- "$directory"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh English official resources'
            git push
          fi
      - name: Report coverage
        if: always()
        shell: bash
        run: cat inventory/COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Fail visibly if archive still has gaps
        if: steps.sync.outputs.result != '0'
        run: python -c "raise SystemExit('Coverage or validation gaps remain; see inventory reports')"
